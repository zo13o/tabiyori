<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行診断アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .screen.active {
      display: block;
    }

    #screen-loading.screen.active {
      display: flex;
    }

    .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #screen-07, #screen-08 {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .scrollable-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* DAY1 / DAY2 の切り替え表示管理 */
    .day-content {
      display: none;
      width: 100%;
    }
    .day-content.active-day {
      display: block;
    }

    /* ========================================================
       DAY1 / DAY2 タブボタン固定配置エリア
       ======================================================== */
    .day-switch-area-1 {
      position: absolute;
      top: 290px;
      left: 2px;
      width: 105px;
      height: 36px;
      cursor: pointer;
      z-index: 150;
      background: transparent;
      border: none;
    }

    .day-switch-area-2 {
      position: absolute;
      top: 290px;
      left: 106px;
      width: 103px;
      height: 33px;
      cursor: pointer;
      z-index: 150;
      background: transparent;
      border: none;
    }

    .plan-form-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1300px;
      pointer-events: none;
    }

    /* 入力画面の各選択ボックス */
    .resizable-box {
      position: absolute;
      background: transparent;
      border: none;
      pointer-events: auto;
      z-index: 100;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 12px;
      font-size: 14px;
      color: #333333;
      text-align: left;
    }

    #box-pref         { top: 325px; left: 46px; width: 338px; height: 52px; }
    #box-purpose      { top: 430px; left: 43px; width: 339px; height: 54px; }
    #box-duration     { top: 535px; left: 43px; width: 338px; height: 52px; }
    #box-transport    { top: 640px; left: 41px; width: 343px; height: 50px; }
    #box-travel-time  { top: 744px; left: 42px; width: 341px; height: 51px; }
    #box-budget       { top: 845px; left: 41px; width: 339px; height: 50px; }
    #box-companion    { top: 949px; left: 40px; width: 343px; height: 53px; }
    #box-generation   { top: 1053px; left: 41px; width: 341px; height: 51px; }
    #box-submit       { top: 1157px; left: 162px; width: 102px; height: 30px; padding-left: 0; justify-content: center; }

    #custom-picker-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #custom-picker-modal.active {
      display: flex;
      pointer-events: auto;
    }

    .picker-card {
      background: #ffffff;
      width: 70%;
      max-width: 280px;
      max-height: 50vh;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      overflow-y: auto;
      padding: 6px 0;
    }

    .picker-item {
      padding: 10px 16px;
      font-size: 13px;
      color: #b30000; /* 基本は暗めの赤文字 */
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid #f7f7f7;
    }

    /* 「誰と旅をするか」の項目は黒字にする */
    .picker-item.companion-item {
      color: #333333 !important;
    }

    .picker-item.disabled {
      color: #666666 !important;
      background-color: #eeeeee !important;
      font-weight: 400 !important;
      cursor: not-allowed !important;
      opacity: 0.7;
      pointer-events: none;
    }

    .click-area {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    /* 各質問の選択肢位置設定 */
    .opt-4-1 { top: 38.5%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }
    .opt-4-2 { top: 48.0%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }
    .opt-4-3 { top: 57.5%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }
    .opt-4-4 { top: 67.0%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }

    .opt-2-1 { top: 45.0%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }
    .opt-2-2 { top: 58.0%; left: 12%; width: 76%; height: 7.5%; border-radius: 12px; }

    .back-button { top: 80.5%; left: 12%; width: 28%; height: 4.5%; border-radius: 20px; }

    /* 診断結果画面 */
    #screen-06 {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FF77D9;
    }

    #screen-06 .result-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      display: block;
    }

    .result-card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      transform: translateY(100%);
      transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #screen-06.slide-up .result-card-wrapper {
      transform: translateY(0);
    }

    .result-card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .result-btn-end {
      position: absolute; bottom: 4.5%; left: 18.5%; width: 30%; height: 4.5%; border-radius: 20px; z-index: 200; cursor: pointer;
    }

    .result-btn-plan {
      position: absolute; bottom: 4.5%; left: 51.5%; width: 44%; height: 4.5%; border-radius: 20px; z-index: 200; cursor: pointer;
    }

    .plan-detail-overlay {
      position: sticky;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      margin-top: -80px;
      pointer-events: none;
      z-index: 200;
    }

    .plan-detail-end {
      position: absolute; bottom: 35px; left: 18.5%; width: 30%; height: 40px; border-radius: 20px; z-index: 210; cursor: pointer; pointer-events: auto;
    }

    .plan-detail-save {
      position: absolute; bottom: 35px; left: 51.5%; width: 44%; height: 40px; border-radius: 20px; z-index: 210; cursor: pointer; pointer-events: auto;
    }

    #screen-loading {
      background-color: #ffffff;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 20;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .spinner-box {
      position: relative;
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(24, 119, 242, 0.12);
      border-top-color: #1877F2;
      border-radius: 50%;
      animation: spin 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    .center-icon {
      width: 22px;
      height: 22px;
      fill: #1877F2;
      animation: pulse 1.6s ease-in-out infinite alternate;
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
      color: #1877F2;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .loading-sub {
      font-size: 12px;
      color: #1F2937;
      font-weight: 500;
      opacity: 0.8;
      min-height: 18px;
    }

    .dots-container {
      display: flex;
      gap: 5px;
      margin-top: 16px;
    }

    .dot {
      width: 5px;
      height: 5px;
      background-color: #1877F2;
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="screen-01" class="screen active" onclick="showScreen('screen-02')">
      <img src="アプリデザイン検討-01.png" alt="" class="main-img">
    </div>

    <div id="screen-02" class="screen">
      <img src="アプリデザイン検討-02.png" alt="" class="main-img">
      <div class="click-area opt-4-1" onclick="selectOption('screen-02', 'アプリデザイン検討-06.png', 'screen-03', 1, 1)"></div>
      <div class="click-area opt-4-2" onclick="selectOption('screen-02', 'アプリデザイン検討-10.png', 'screen-03', 1, 2)"></div>
      <div class="click-area opt-4-3" onclick="selectOption('screen-02', 'アプリデザイン検討-14.png', 'screen-03', 1, 3)"></div>
      <div class="click-area opt-4-4" onclick="selectOption('screen-02', 'アプリデザイン検討-17.png', 'screen-03', 1, 4)"></div>
      <div class="click-area back-button" onclick="showScreen('screen-01')"></div>
    </div>

    <div id="screen-03" class="screen">
      <img src="アプリデザイン検討-03.png" alt="" class="main-img">
      <div class="click-area opt-4-1" onclick="selectOption('screen-03', 'アプリデザイン検討-07.png', 'screen-04', 2, 1)"></div>
      <div class="click-area opt-4-2" onclick="selectOption('screen-03', 'アプリデザイン検討-11.png', 'screen-04', 2, 2)"></div>
      <div class="click-area opt-4-3" onclick="selectOption('screen-03', 'アプリデザイン検討-15.png', 'screen-04', 2, 3)"></div>
      <div class="click-area opt-4-4" onclick="selectOption('screen-03', 'アプリデザイン検討-18.png', 'screen-04', 2, 4)"></div>
      <div class="click-area back-button" onclick="showScreen('screen-02')"></div>
    </div>

    <div id="screen-04" class="screen">
      <img src="アプリデザイン検討-04.png" alt="" class="main-img">
      <div class="click-area opt-2-1" onclick="selectOption('screen-04', 'アプリデザイン検討-08.png', 'screen-05', 3, 1)"></div>
      <div class="click-area opt-2-2" onclick="selectOption('screen-04', 'アプリデザイン検討-12.png', 'screen-05', 3, 2)"></div>
      <div class="click-area back-button" onclick="showScreen('screen-03')"></div>
    </div>

    <div id="screen-05" class="screen">
      <img src="アプリデザイン検討-05.png" alt="" class="main-img">
      <div class="click-area opt-4-1" onclick="selectOptionFinal('screen-05', 'アプリデザイン検討-09.png', 4, 1)"></div>
      <div class="click-area opt-4-2" onclick="selectOptionFinal('screen-05', 'アプリデザイン検討-13.png', 4, 2)"></div>
      <div class="click-area opt-4-3" onclick="selectOptionFinal('screen-05', 'アプリデザイン検討-16.png', 4, 3)"></div>
      <div class="click-area opt-4-4" onclick="selectOptionFinal('screen-05', 'アプリデザイン検討-19.png', 4, 4)"></div>
      <div class="click-area back-button" onclick="showScreen('screen-04')"></div>
    </div>

    <div id="screen-loading" class="screen">
      <div class="loading-content">
        <div class="spinner-box">
          <div class="ring-spinner"></div>
          <svg class="center-icon" viewBox="0 0 24 24">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
        </div>
        <div class="loading-title">分析中...</div>
        <div id="loading-sub-text" class="loading-sub">あなたにぴったりの旅スタイルを計算しています</div>
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <div id="screen-06" class="screen">
      <img id="result-bg" class="result-bg-img" src="" alt="">
      <div class="result-card-wrapper">
        <img id="result-card" class="result-card-img" src="" alt="">
        <div class="result-btn-end" onclick="showScreen('screen-01')"></div>
        <div class="result-btn-plan" onclick="showScreen('screen-07')"></div>
      </div>
    </div>

    <div id="screen-07" class="screen">
      <img src="アプリデザイン検討-52.png" alt="" class="scrollable-img">
      <div class="plan-form-overlay">
        <div id="box-pref" class="resizable-box" onclick="openPicker('pref')"></div>
        <div id="box-purpose" class="resizable-box" onclick="openPicker('purpose')"></div>
        <div id="box-duration" class="resizable-box" onclick="openPicker('duration')"></div>
        <div id="box-transport" class="resizable-box" onclick="openPicker('transport')"></div>
        <div id="box-travel-time" class="resizable-box" onclick="openPicker('travel-time')"></div>
        <div id="box-budget" class="resizable-box" onclick="openPicker('budget')"></div>
        <div id="box-companion" class="resizable-box" onclick="openPicker('companion')"></div>
        <div id="box-generation" class="resizable-box" onclick="openPicker('generation')"></div>
        <div id="box-submit" class="resizable-box" onclick="submitPlan()"></div>
      </div>
    </div>

    <div id="screen-08" class="screen">
      <!-- DAY1 コンテンツ -->
      <div id="content-day1" class="day-content active-day">
        <img id="plan-img-day1" src="" alt="プラン DAY1" class="scrollable-img">
      </div>

      <!-- DAY2 コンテンツ -->
      <div id="content-day2" class="day-content">
        <img id="plan-img-day2" src="" alt="プラン DAY2" class="scrollable-img">
      </div>

      <!-- 切り替えボタン -->
      <div class="day-switch-area-1" onclick="switchDay('day1')"></div>
      <div class="day-switch-area-2" onclick="switchDay('day2')"></div>
      
      <div class="plan-detail-overlay">
        <div class="plan-detail-end" onclick="showScreen('screen-01')"></div>
        <div class="plan-detail-save" onclick="savePlan()"></div>
      </div>
    </div>

  </div>

  <div id="custom-picker-modal" onclick="closePickerOnBg(event)">
    <div class="picker-card" id="picker-card-content"></div>
  </div>

  <script>
    const userAnswers = { 1: 1, 2: 1, 3: 1, 4: 1 };
    let currentAnswerKey = '1.1.1.1'; 

    const validPrefs = [
      "北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
      "茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
      "新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県",
      "静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県",
      "奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県",
      "徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県",
      "熊本県","大分県","宮崎県","鹿児島県","沖縄県"
    ];

    const pickerOptionsData = {
      'pref': validPrefs,
      'purpose': ["観光・レジャー", "卒業旅行・記念旅行", "推し活・イベント遠征", "グルメ", "温泉・リフレッシュ"],
      'duration': ["日帰り", "1泊", "2泊", "3泊", "それ以上"],
      'transport': ["車", "電車・新幹線・バス", "飛行機", "自転車", "徒歩"],
      'travel-time': ["1時間", "2時間", "3時間", "それ以上"],
      'budget': ["〜1万", "〜2万", "〜3万", "〜5万", "〜7万", "〜10万", "それ以上"],
      'companion': ["一人", "友人", "恋人", "家族"],
      'generation': ["10代", "20代", "30代", "40代", "50代", "60代", "70代", "80代"]
    };

    function getAllowedValuesForCurrentState(key) {
      const allowedMap = {
        'pref': ['大阪府'],
        'purpose': ['観光・レジャー', 'グルメ'],
        'duration': ['日帰り', '1泊'],
        'transport': ['電車・新幹線・バス'],
        'travel-time': ['3時間'],
        'budget': ['〜3万'],
        'companion': null,
        'generation': ['10代', '20代', '30代', '40代', '50代']
      };
      return allowedMap[key] || null;
    }

    const selectedValues = {
      'pref': '', 'purpose': '', 'duration': '', 'transport': '',
      'travel-time': '', 'budget': '', 'companion': '', 'generation': ''
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        if (s.id === 'screen-06') {
          s.classList.remove('slide-up');
        }
      });

      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('active');
        target.scrollTop = 0;

        if (screenId === 'screen-06') {
          setTimeout(() => {
            target.classList.add('slide-up');
          }, 50);
        }

        if (screenId === 'screen-08') {
          switchDay('day1');
        }
      }
    }

    function switchDay(day) {
      const content1 = document.getElementById('content-day1');
      const content2 = document.getElementById('content-day2');

      const screen08 = document.getElementById('screen-08');
      if (screen08) screen08.scrollTop = 0;

      if (day === 'day1') {
        content1.classList.add('active-day');
        content2.classList.remove('active-day');
      } else {
        content2.classList.add('active-day');
        content1.classList.remove('active-day');
      }
    }

    function selectOption(currentScreenId, selectedImgPath, nextScreenId, qNum, optNum) {
      userAnswers[qNum] = optNum;
      const currentImg = document.querySelector(`#${currentScreenId} .main-img`);
      if (currentImg) currentImg.src = selectedImgPath;
      setTimeout(() => showScreen(nextScreenId), 300);
    }

    function selectOptionFinal(currentScreenId, selectedImgPath, qNum, optNum) {
      userAnswers[qNum] = optNum;
      const currentImg = document.querySelector(`#${currentScreenId} .main-img`);
      if (currentImg) currentImg.src = selectedImgPath;

      currentAnswerKey = `${userAnswers[1]}.${userAnswers[2]}.${userAnswers[3]}.${userAnswers[4]}`;

      setTimeout(() => {
        showScreen('screen-loading');
        
        const subTextEl = document.getElementById('loading-sub-text');
        if (subTextEl) subTextEl.textContent = 'あなたにぴったりの旅スタイルを計算しています';

        setTimeout(() => {
          if (subTextEl) subTextEl.textContent = '診断結果を構築中...';
          
          setTimeout(() => {
            if (currentAnswerKey === '1.1.1.1' || currentAnswerKey === '1.3.1.1' || currentAnswerKey === '1.1.2.1' || currentAnswerKey === '1.2.1.1') {
              setupResultImages('アプリデザイン検討-44.png', 'アプリデザイン検討-45.png', '#FF77D9');
            } else if (currentAnswerKey === '1.1.1.2') {
              setupResultImages('診断結果-01.png', '診断結果-02.png', '#FF77D9');
            } else if (currentAnswerKey === '1.1.1.3') {
              setupResultImages('診断結果-03.png', '診断結果-04.png', '#FF77D9');
            } else if (currentAnswerKey === '1.1.1.4') {
              setupResultImages('診断結果-05.png', '診断結果-06.png', '#65D36E');
            } else if (currentAnswerKey === '1.1.2.2') {
              setupResultImages('診断結果-10.png', '診断結果-09.png', '#65D36E');
            } else if (currentAnswerKey === '1.1.2.3') {
              setupResultImages('診断結果-12.png', '診断結果-11.png', '#65D36E');
            } else if (currentAnswerKey === '1.1.2.4') {
              setupResultImages('診断結果-14.png', '診断結果-13.png', '#65D36E');
            } else if (currentAnswerKey === '1.2.1.2') {
              setupResultImages('診断結果-18.png', '診断結果-17.png', '#FF77D9');
            } else if (currentAnswerKey === '1.2.1.3') {
              setupResultImages('診断結果-19.png', '診断結果-20.png', '#65D36E');
            } else if (currentAnswerKey === '1.2.1.4') {
              setupResultImages('診断結果-21.png', '診断結果-22.png', '#65D36E');

    function setupResultImages(bgFilename, cardFilename, bgColor) {
      const bgImg = document.getElementById('result-bg');
      const cardImg = document.getElementById('result-card');
      const screen06 = document.getElementById('screen-06');
      if (bgImg) bgImg.src = bgFilename;
      if (cardImg) cardImg.src = cardFilename;
      if (screen06) screen06.style.backgroundColor = bgColor;
    }

    function openPicker(key) {
      const cardContent = document.getElementById('picker-card-content');
      cardContent.innerHTML = '';
      cardContent.scrollTop = 0;

      const allowedList = getAllowedValuesForCurrentState(key);

      (pickerOptionsData[key] || []).forEach(opt => {
        const item = document.createElement('div');
        item.className = 'picker-item';
        
        if (key === 'companion') {
          item.classList.add('companion-item');
        }

        item.textContent = opt;

        if (allowedList && !allowedList.includes(opt)) {
          item.classList.add('disabled');
        }
        
        item.onclick = () => {
          if (item.classList.contains('disabled')) return;
          selectedValues[key] = opt;
          document.getElementById(`box-${key}`).textContent = opt;
          closePicker();
        };

        cardContent.appendChild(item);
      });
      
      document.getElementById('custom-picker-modal').classList.add('active');
    }

    function closePicker() {
      document.getElementById('custom-picker-modal').classList.remove('active');
    }

    function closePickerOnBg(event) {
      if (event.target.id === 'custom-picker-modal') closePicker();
    }

    function submitPlan() {
      const pref = (selectedValues['pref'] || document.getElementById('box-pref').textContent).trim();
      const purpose = (selectedValues['purpose'] || document.getElementById('box-purpose').textContent).trim();
      const duration = (selectedValues['duration'] || document.getElementById('box-duration').textContent).trim();
      const transport = (selectedValues['transport'] || document.getElementById('box-transport').textContent).trim();
      const travelTime = (selectedValues['travel-time'] || document.getElementById('box-travel-time').textContent).trim();
      const budget = (selectedValues['budget'] || document.getElementById('box-budget').textContent).trim();
      const companion = (selectedValues['companion'] || document.getElementById('box-companion').textContent).trim();
      const generation = (selectedValues['generation'] || document.getElementById('box-generation').textContent).trim();

      if (!pref || !purpose || !duration || !transport || !travelTime || !budget || !companion || !generation) {
        alert('すべての項目を選択してください。');
        return;
      }

      const imgDay1 = document.getElementById('plan-img-day1');
      const imgDay2 = document.getElementById('plan-img-day2');
      imgDay1.src = '';
